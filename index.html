<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>การ์ดวันแม่ - บอกรักแม่</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mali:ital,wght@0,200;0,300;0,400;0,500;0,600;0,700;1,200;1,300;1,400;1,500;1,600;1,700&display=swap" rel="stylesheet">
<style>
  :root {
    --primary: #c47a92;
    --secondary: #8ba3b8;
    --text: #6b5b6e;
    --bg1: #fff5f7;
    --bg2: #f0f7ff;
    --bg3: #fffaf0;
    --front-bg: linear-gradient(to bottom, #fffafc, #fff5f8);
    --back-bg: linear-gradient(160deg, #fffafc 0%, #f8fbff 100%);
    --shadow: rgba(180, 140, 160, 0.35);
    --hint: #d4a5b5;
    --sig: #a88a9a;
    --heart: #e8a0b0;
  }

  [data-theme="pink"] {
    --primary: #c47a92; --secondary: #8ba3b8; --text: #6b5b6e;
    --bg1: #fff5f7; --bg2: #f0f7ff; --bg3: #fffaf0;
    --front-bg: linear-gradient(to bottom, #fffafc, #fff5f8);
    --back-bg: linear-gradient(160deg, #fffafc 0%, #f8fbff 100%);
    --shadow: rgba(180, 140, 160, 0.35); --hint: #d4a5b5; --sig: #a88a9a; --heart: #e8a0b0;
  }
  [data-theme="blue"] {
    --primary: #6a9bc3; --secondary: #a0c4d8; --text: #4a5e6e;
    --bg1: #f0f7fc; --bg2: #e8f4f8; --bg3: #f5fafc;
    --front-bg: linear-gradient(to bottom, #f8fcff, #eef6fb);
    --back-bg: linear-gradient(160deg, #f8fcff 0%, #eef6fb 100%);
    --shadow: rgba(100, 150, 180, 0.3); --hint: #8bb8d0; --sig: #7a9bb0; --heart: #7eb8d4;
  }
  [data-theme="lavender"] {
    --primary: #9b7bb8; --secondary: #b8a0c8; --text: #5a4a6a;
    --bg1: #f8f4fc; --bg2: #f0e8f8; --bg3: #faf5ff;
    --front-bg: linear-gradient(to bottom, #faf6ff, #f3ecf9);
    --back-bg: linear-gradient(160deg, #faf6ff 0%, #f3ecf9 100%);
    --shadow: rgba(150, 120, 180, 0.3); --hint: #c4a8d4; --sig: #9a80b0; --heart: #c9a0e0;
  }
  [data-theme="peach"] {
    --primary: #d4896a; --secondary: #e0a88a; --text: #6e4a3a;
    --bg1: #fff8f4; --bg2: #fff0e8; --bg3: #fffaf5;
    --front-bg: linear-gradient(to bottom, #fffaf6, #fff3eb);
    --back-bg: linear-gradient(160deg, #fffaf6 0%, #fff3eb 100%);
    --shadow: rgba(200, 140, 100, 0.3); --hint: #e8b89a; --sig: #c09070; --heart: #f0a880;
  }
  [data-theme="mint"] {
    --primary: #6a9b8a; --secondary: #8ab8a8; --text: #3a5a4a;
    --bg1: #f4faf8; --bg2: #e8f5f0; --bg3: #f5fcf9;
    --front-bg: linear-gradient(to bottom, #f8fcfa, #eef8f4);
    --back-bg: linear-gradient(160deg, #f8fcfa 0%, #eef8f4 100%);
    --shadow: rgba(100, 150, 130, 0.3); --hint: #a0c8b8; --sig: #70a090; --heart: #80c0a8;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, var(--bg1) 0%, var(--bg2) 50%, var(--bg3) 100%);
    font-family: 'Sarabun', sans-serif;
    overflow-x: hidden;
    padding: 20px;
    transition: background 0.4s ease;
    font-family: mali;
  }

  .header {
    text-align: center;
    margin-bottom: 18px;
    color: var(--primary);
  }
  .header h1 {
    font-size: 1.4rem;
    font-weight: 500;
    letter-spacing: 2px;
  }
  .header p {
    font-size: 0.95rem;
    color: var(--secondary);
    margin-top: 6px;
  }

  .color-bar {
    display: flex;
    gap: 12px;
    justify-content: center;
    margin-bottom: 22px;
    flex-wrap: wrap;
  }
  .color-btn {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    border: 3px solid transparent;
    cursor: pointer;
    transition: transform 0.2s, border-color 0.2s, box-shadow 0.2s;
    position: relative;
  }
  .color-btn:hover { transform: scale(1.12); }
  .color-btn.active {
    border-color: #444;
    box-shadow: 0 0 0 2px white, 0 0 0 4px #444;
    transform: scale(1.1);
  }
  .color-btn.pink { background: linear-gradient(135deg, #f8c8d8, #c47a92); }
  .color-btn.blue { background: linear-gradient(135deg, #b8d8f0, #6a9bc3); }
  .color-btn.lavender { background: linear-gradient(135deg, #d8c8e8, #9b7bb8); }
  .color-btn.peach { background: linear-gradient(135deg, #f8d0b8, #d4896a); }
  .color-btn.mint { background: linear-gradient(135deg, #c0e0d0, #6a9b8a); }

  .color-btn span {
    position: absolute;
    bottom: -18px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 0.62rem;
    color: #888;
    white-space: nowrap;
    opacity: 0.85;
  }

  .card-container {
    perspective: 2000px;
    -webkit-perspective: 2000px;
    width: 340px;
    height: 510px;
    cursor: pointer;
    position: relative;
  }

  .card {
    width: 100%;
    height: 100%;
    position: relative;
    transform-style: preserve-3d;
    -webkit-transform-style: preserve-3d;
    transition: transform 1.2s cubic-bezier(0.4, 0.0, 0.2, 1);
    border-radius: 18px;
    box-shadow: 0 25px 50px -12px var(--shadow);
  }

  .card.flipped {
    transform: rotateY(-180deg);
    -webkit-transform: rotateY(-180deg);
  }

  .card-face {
    position: absolute;
    width: 100%;
    height: 100%;
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
    border-radius: 18px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }

  .front { background: #fff; }
  .front-img {
    width: 100%;
    height: 70%;
    object-fit: cover;
    object-position: center top;
  }
  .front-content {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: var(--front-bg);
    padding: 18px 20px;
    text-align: center;
  }
  .front-content .title {
    font-family: 'Playfair Display', serif;
    font-size: 1.1rem;
    color: var(--primary);
    font-weight: 600;
    margin-bottom: 6px;
    letter-spacing: 1px;
  }
  .front-content .subtitle {
    font-size: 1.05rem;
    color: var(--secondary);
    font-weight: 400;
  }
  .front-content .hint {
    margin-top: 12px;
    font-size: 0.78rem;
    color: var(--hint);
    opacity: 0.85;
    animation: pulse 2s infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 0.6; }
    50% { opacity: 1; }
  }

  .back {
    background: var(--back-bg);
    transform: rotateY(180deg);
    -webkit-transform: rotateY(180deg);
    display: flex;
    flex-direction: column;
  }
  .back-img {
    width: 100%;
    height: 42%;
    object-fit: cover;
    object-position: center;
  }
  .back-content {
    flex: 1;
    padding: 22px 26px 20px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }
  .message {
    text-align: center;
    color: var(--text);
    line-height: 1.7;
  }
  .message .greeting {
    font-size: 1.25rem;
    color: var(--primary);
    font-weight: 600;
    margin-bottom: 14px;
  }
  .message p {
    font-size: 0.98rem;
    margin-bottom: 10px;
    font-weight: 400;
  }
  .message .highlight {
    color: var(--secondary);
    font-weight: 500;
  }
  .signature {
    text-align: center;
    margin-top: 8px;
  }
  .signature .from {
    font-size: 0.9rem;
    color: var(--sig);
    margin-bottom: 2px;
  }
  .signature .heart {
    font-size: 1.3rem;
    color: var(--heart);
  }

  .footer-note {
    text-align: center;
    margin-top: 28px;
    font-size: 0.82rem;
    color: var(--sig);
  }

  @media (max-width: 400px) {
    .card-container { width: 300px; height: 450px; }
    .front-content .title { font-size: 1.35rem; }
    .message .greeting { font-size: 1.15rem; }
    .message p { font-size: 0.92rem; }
  }

  /* ===== Jasmine Falling Animation ===== */
  .jasmine-layer {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    pointer-events: none;
    z-index: 9999;
  }

  .jasmine {
    position: absolute;
    top: -70px;
    width: var(--size);
    height: var(--size);
    opacity: var(--opacity);
    animation:
      jasmineFall var(--duration) linear forwards,
      jasmineSway 3s ease-in-out infinite alternate;
    filter: drop-shadow(0 3px 4px rgba(80, 100, 80, 0.15));
    will-change: transform, margin-left;
  }

  .jasmine svg {
    width: 100%;
    height: 100%;
    display: block;
  }

  @keyframes jasmineFall {
    0% {
      transform: translateY(-80px) rotate(0deg);
    }
    100% {
      transform: translateY(calc(100vh + 120px)) rotate(var(--rotate));
    }
  }

  @keyframes jasmineSway {
    0% { margin-left: -18px; }
    100% { margin-left: 18px; }
  }

  @media (prefers-reduced-motion: reduce) {
    .jasmine {
      animation: none;
      display: none;
    }
  }

</style>
</head>

            <p>สำหรับทุกคำสอน ทุกการกอด<br>และทุกวันที่แม่อยู่ข้างๆ</p>
            <p class="highlight">ลูกภูมิใจที่มีแม่เป็นแม่<br>และจะรักแม่ตลอดไป</p>
          </div>
          <div class="signature">
            <div class="from">ด้วยรักจากลูก</div>
            <div class="heart">♡</div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="footer-note">
    สุขสันต์วันแม่แห่งชาติ 12 สิงหาคม
  </div>

  <script>
    function toggleCard() {
      document.getElementById('card').classList.toggle('flipped');
    }

    document.querySelectorAll('.color-btn').forEach(btn => {
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        document.querySelectorAll('.color-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        document.body.setAttribute('data-theme', btn.dataset.theme);
      });
    });

    /* ===== Falling Jasmine ===== */
    const jasmineLayer = document.getElementById('jasmineLayer');

    function createJasmine() {
      const flower = document.createElement('div');
      flower.className = 'jasmine';

      const size = Math.random() * 22 + 20;
      const duration = Math.random() * 5 + 7;
      const opacity = Math.random() * 0.35 + 0.55;
      const rotate = (Math.random() * 500 + 180) + 'deg';

      flower.style.left = Math.random() * 100 + 'vw';
      flower.style.setProperty('--size', size + 'px');
      flower.style.setProperty('--duration', duration + 's');
      flower.style.setProperty('--opacity', opacity);
      flower.style.setProperty('--rotate', rotate);

      flower.innerHTML = `
        <svg viewBox="0 0 100 100" aria-hidden="true">
          <g fill="#ffffff" stroke="#e8eee9" stroke-width="1.5">
            <ellipse cx="50" cy="27" rx="18" ry="28"/>
            <ellipse cx="72" cy="43" rx="18" ry="28" transform="rotate(72 72 43)"/>
            <ellipse cx="64" cy="70" rx="18" ry="28" transform="rotate(144 64 70)"/>
            <ellipse cx="36" cy="70" rx="18" ry="28" transform="rotate(216 36 70)"/>
            <ellipse cx="28" cy="43" rx="18" ry="28" transform="rotate(288 28 43)"/>
          </g>
          <circle cx="50" cy="50" r="9" fill="#f4df9b"/>
          <circle cx="50" cy="50" r="4" fill="#e7c967"/>
        </svg>
      `;

      jasmineLayer.appendChild(flower);

      setTimeout(() => {
        flower.remove();
      }, duration * 1000);
    }

    setInterval(createJasmine, 650);

    for (let i = 0; i < 8; i++) {
      setTimeout(createJasmine, i * 250);
    }

  </script>
</body>
</html>
